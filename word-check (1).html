<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Check</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0f19;
      color: #e8eefc;
    }
    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input {
      flex: 1;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.25);
      color: #e8eefc;
      outline: none;
    }
    button {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.25);
      color: #e8eefc;
      cursor: pointer;
      font-size: 18px;
      display: grid;
      place-items: center;
    }
    .msg {
      margin-top: 14px;
      min-height: 22px;
      font-size: 16px;
      font-weight: 600;
    }
    .good { color: #39d98a; }
    .bad  { color: #ff4d4d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter the word</h1>

    <div class="row">
      <input id="wordInput" type="text" placeholder="Type a word..." autocomplete="off" />
      <button id="goBtn">➜</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

  <script>
    const input = document.getElementById("wordInput");
    const btn = document.getElementById("goBtn");
    const msg = document.getElementById("message");

    function setMessage(text, ok) {
      msg.textContent = text;
      msg.className = "msg " + (ok ? "good" : "bad");
    }

    function checkWord() {
      const val = (input.value || "").trim().toLowerCase();

      if (val === "candle") {
        setMessage("Correct: b2xcoSuW_WA", true);
      } else if (val === "frog") {
        setMessage("Correct: WZ5ZDkbCoRo", true);
      } else {
        setMessage("try again", false);
      }
    }

    btn.addEventListener("click", checkWord);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkWord();
    });
  </script>
</body>
</html>
